# CoLM history 变量的容差分级。见 docs/design.md §8.1。
#
# 里程碑 1 只做逐位比较，本文件此时不参与比较，只被 tier-check 校验完备性。
# 计划 3 的 colm-hist 与 C 阶段的 Rust-vs-Fortran 对账会真正消费它。
#
# **层级不倒挂（不变式）**：一个变量的层级不得严于它任何一个输入的层级。
# 否则 C 阶段一个数值忠实的 Rust 移植会在该变量上继承上游 ~1e-7 的差异，
# 而表格把那判成 bug；最省事的"修复"是整体放松 tier0/tier1，
# 那就把分层的全部价值毁掉了。首版违反了这条 8 次（见 tier2 末尾的注释）。
#
# **分类依据与其局限**：当前归属由两条证据得出 —— 在两个黄金窗口上实测变量间
# 相关性，以及回源码追依赖链。但相关性只能发现窗口**实际执行到**的依赖：
# 例如冬季窗口 f_lai 恒为 0.2，任何雪相关性都测不出来，是查源码才确认它的
# 条件依赖。**新增黄金窗口时必须重跑这项分类**，尤其是能真正生成雪层的窗口。
#
# 禁止在测试里内联容差魔数 —— EarthMesh 就是在两个测试里对同一个网格
# 用了 2.0e-6 和 2.0e-4。

[tier0]
description = "纯函数、无迭代、无收敛。任何差异都是 bug。"
rule = "bitwise"
variables = [
  "time", "lat", "lon",
  # 维度坐标：常量整数索引，不参与任何计算
  "band", "lake", "rtyp", "soil", "soilinterface", "soilsnow", "vegnodes",
  # 未启用的用户自定义诊断槽：两个黄金文件里全是 -1e36 的 missing_value
  "f_sensors",
  "f_green",
  "f_xy_t", "f_xy_q", "f_xy_pbot", "f_xy_us", "f_xy_vs",
  "f_xy_solarin", "f_xy_frl", "f_xy_prc", "f_xy_prl",
  "f_xy_rain", "f_xy_snow",
]

[tier1]
description = "确定性代数、无迭代物理。"
rule = "relative"
rtol = 1e-12
variables = [
  # **只有下行辐射留在 tier1。** 它们由 `f_xy_solarin`（tier0）经解析分带得来，
  # 实测 264/264 逐位相等。
  "f_solvd", "f_solvi", "f_solnd", "f_solni",
  "f_solvdln", "f_solviln", "f_solndln", "f_solniln",
  # `f_sr*`/`f_sab*`/`f_alb`/`f_rnet`/`f_emis`/`f_fm`/`f_fh`/`f_fq`/`f_fm10m`
  # 已经从 tier1 移入 tier2 —— 它们的"确定性代数"是对的，但**输入全部是 tier2**，
  # 于是 tier1 的 1e-12 严于输入，违反本文件顶部的不变式。实测链条（CN-Cng）：
  #   `f_fevpl`（叶温求解器，tier2）→ `f_ldew`（冠层持水，tier2，第 108 条差 3.0%）
  #   → `fwet_snow = ((10/(48*(lai+sai)))*ldew_snow)**(2/3)`（`MOD_LeafTemperature.F90:1226`）
  #   → `MOD_Albedo` 的 `scat`/`beta0`（`:629-631`）→ `f_alb`（可见 direct 差 4.3e-3）
  #   → `f_sr*`（= 下行 × alb）、`f_sab*`（= 下行 × (1-alb)）、`f_rnet`。
  # 实测 `Δalb` 与 `Δfwet_snow` 的相关系数 0.69（可见正向、近红外反向，符号符合湿冠层
  # 物理），斜率 0.50/-0.91 —— 是继承，不是反照率算错。
  #   `f_fm`/`f_fh`/`f_fq`/`f_fm10m` 与 `f_zol`/`f_rib`/`f_ustar`/`f_tstar`/`f_qstar`
  #   出自**同一个** `MOD_SurfaceLayer` 迭代，后者本来就在 tier2。
  #   `f_emis` 依赖 `f_lai`（tier2 显式条目）与 `f_t_grnd`（tier2）。

]

[tier2]
description = """
含迭代收敛的模块。容差不得紧于求解器自身的收敛容差。
比较时必须同时报告迭代计数与回退次数（如 VSF implicit/explicit 计数）；
回退次数变化即为红旗，即使数值落在容差内。
"""
rule = "absolute_and_relative"
atol = 1e-7
rtol = 1e-7
solver_tolerance_floor = 8e-8   # MOD_Hydro_SoilWater 的 Newton 容差
variables = [
  "f_fsena", "f_fseng", "f_fsenl",
  "f_lfevpa", "f_fevpa", "f_fevpg", "f_fevpl",
  "f_etr", "f_etrsun", "f_etrsha",
  "f_assim", "f_assimsun", "f_assimsha",
  "f_gssun", "f_gssha", "f_rstfacsun", "f_rstfacsha",
  "f_tleaf", "f_t_grnd", "f_tref", "f_qref",
  "f_fgrnd", "f_taux", "f_tauy", "f_ustar", "f_ustar2",
  "f_tstar", "f_qstar", "f_rib", "f_zol", "f_us10m", "f_vs10m",
  "f_zwt", "f_wat", "f_wat_inst", "f_wa", "f_wa_inst",
  # 多层状态量：全部来自隐式列求解或相变，逐层值依赖迭代细节
  "f_h2osoi", "f_t_soisno", "f_wice_soisno", "f_wliq_soisno",
  "f_qlayer", "f_rootr", "f_vegwp",
  "f_t_lake", "f_lake_icefrac", "f_lake_deficit",
  "f_rnof", "f_rsur", "f_rsub", "f_rsur_ie", "f_rsur_se",
  "f_qinfl", "f_qdrip", "f_qintr", "f_ldew",
  # `f_qcharge` 只在 `DEF_USE_VariablySaturatedFlow = .false.` 时才写出
  # （`MOD_Hist.F90:698`），黄金算例是开着 VSF 的所以没有它；对齐算例有。
  "f_qcharge",
  "f_frcsat", "f_rss", "f_respc",
  "f_wdsrf", "f_wdsrf_inst", "f_wetwat", "f_wetwat_inst", "f_wetzwt",
  "f_lai", "f_laisun", "f_laisha",
  "f_xerr", "f_zerr",
  # 从 tier0/tier1 移入。依据见本文件顶部的"层级不倒挂"不变式：
  #   f_z0m  —— 是 MOD_LeafTemperature_Extended.F90:1299 的输出（40 次准 Newton
  #             迭代耦合 Monin-Obukhov），设计文档 §2.11 点名的最难移植单元之一
  #   f_lai / f_sai —— 植被积雪开启时乘以 sigf，继承雪盖状态
  #   f_sigf / f_fsno —— MOD_SnowFraction 的输出，由 scv/snowdp 驱动
  #   f_scv / f_snowdp —— 雪盖状态本身
  #   f_olrg / f_trad —— 由地表与叶片温度导出（实测与 f_t_soisno 相关 +0.98）
  "f_z0m", "f_sai", "f_sigf", "f_fsno", "f_scv", "f_snowdp", "f_olrg", "f_trad",
  # 2026 年第二轮：tier1 那 19 条全红的量搬进来。它们**不是**新出现的误差，
  # 而是原来就被 tier1 误判 —— 见 [tier1] 里的实测链条。搬进来之后 tier1 的
  # "超出即视为实现差异" 才算数：一条红的 tier1 仍要么是 bug，要么还要再搬。
  "f_alb", "f_sr", "f_sabg", "f_sabvsun", "f_sabvsha",
  "f_srvd", "f_srvi", "f_srnd", "f_srni",
  "f_srvdln", "f_srviln", "f_srndln", "f_srniln",
  "f_rnet", "f_emis", "f_fm", "f_fh", "f_fq", "f_fm10m",
]

[tier3]
description = "整场统计等价。判据挂在 design.md §2.8/§2.8b 的实测基线上。"
rule = "statistical"
variables = []          # 逐变量判据由 colm-hist 在计划 3 中定义

[tier3.baselines]
# 湿季窗口 CN-Cng-wet，剔除前 4 天预热，观测仅 qc==0
rnet_r2_min = 0.999
qle_r2_min  = 0.85
