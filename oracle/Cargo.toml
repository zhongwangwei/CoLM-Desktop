[package]
name = "oracle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true   # 必须显式 opt-in
license.workspace = true
publish.workspace = true

[dependencies]
# 只被 tests/generated_case.rs 用到：验证生成的算例与手写那份语义等价。
colm-case = { path = "../crates/colm-case" }
colm-forcing = { path = "../crates/colm-forcing" }
# 两处用到：tests/histmap.rs 拿生成的闸门表跟入库的黄金文件对；
# tests/metrics.rs 复现 design.md §2.8 / §2.8b 的六行指标表。
#
# 依赖方向是 oracle → colm-hist，反过来不行 —— 闸门表那一半必须无依赖，
# 否则 netcdf 会跟着它一起被拖进 GUI。`io` 只开在这里：它把读文件那一半
# 打开，而那一半确实需要 netcdf。
#
# 顺带的效果：`cargo clippy --workspace` 因此才会去编 `obs.rs`。
# 没有这个 feature 的话，默认构建根本不编它，lint 也就永远看不到它。
colm-hist = { path = "../crates/colm-hist", features = ["io"] }
colm-kernel = { path = "../crates/colm-kernel" }
colm-namelist = { path = "../crates/colm-namelist" }
# tests/generated_case.rs 用它读站点自带的经纬度与地类 —— 那三项不该抄。
colm-srfdata = { path = "../crates/colm-srfdata" }
anyhow.workspace = true
# 没有 sha2：输入校验借 colm-kernel 的 `sha256_hex`。三个 PLUMBER2 文件最大
# 15 MB，整读进内存没有问题，而少一份摘要实现就少一处会悄悄分叉的地方。
# static 是无条件的，不做成可选 feature。三个平台走同一条构建路径。
# 实测依据（macOS ARM）：静态构建 45.5 秒，产物的动态依赖只剩 libiconv 与
# libSystem 两个系统库，清空所有环境变量后能直接读黄金文件。
# 而动态链接的构建虽然能编过，产出的二进制运行时报
# `Library not loaded: @rpath/libnetcdf.22.dylib ... no LC_RPATH's found`
# —— 开发构建自己都找不到 dylib，打包出去的程序更找不到。
netcdf = { workspace = true, features = ["static"] }
toml.workspace = true
serde = { workspace = true }
# **`float_roundtrip`不是可有可无的。** `extract-urban-extra` 从一份 JSON 读
# 树 LAI 的点值，而 serde_json 默认的浮点解析**会差 1 ULP**：实测
# `1.8337343205163141` 解析成 `1.833734320516314`。那一位之差会一路走到
# history 文件里，把「与真实栅格逐位相同」变成「几乎相同」——而几乎相同
# 是这套黄金回归唯一不接受的结果。见该文件里的 `serde_json_parses_floats_exactly`。
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true

# 显式声明，否则 cargo 会按文件名生成 `golden_run`（下划线），
# 而本计划所有命令用的是连字符名。
#
# 这里只声明 golden-run 一个。golden_compare.rs 要 Task 7 才写、
# tier_check.rs 要 Task 8 才写，提前声明会让 cargo 因源文件不存在而报错。
# 每个 Task 在写出自己的源文件时，再往这里追加对应的 [[bin]] 段。
[[bin]]
name = "golden-run"
path = "src/bin/golden_run.rs"

[[bin]]
name = "golden-compare"
path = "src/bin/golden_compare.rs"

[[bin]]
name = "tier-check"
path = "src/bin/tier_check.rs"

# 一次性的抽取工具：把 21 个 Urban-PLUMBER 站点的土壤剖面点值从全球栅格
# 里抽成 crates/colm-srfdata/src/urban_soil.rs。产物入库，工具只在换
# rawdata 时才需要再跑，所以它依赖真实栅格并不妨碍日常构建。
[[bin]]
name = "extract-urban-soil"
path = "src/bin/extract_urban_soil.rs"

# 第二张表：LCZ 分类、LUCY 区号、土壤颜色档、湖深、地形起伏与坡度、
# 以及 23 年 x 12 月的城市树 LAI/SAI。产物是
# crates/colm-srfdata/src/urban_extra.rs，同样入库。
[[bin]]
name = "extract-urban-extra"
path = "src/bin/extract_urban_extra.rs"
