[package]
name = "colm-desktop-gui"
version = "0.2.0-beta.2"
edition = "2021"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
authors = ["魏忠旺 <weizhw6@mail.sysu.edu.cn>"]
description = "CoLM single-site simulation and evaluation desktop application"
homepage = "https://github.com/zhongwangwei/CoLM-Desktop"
repository = "https://github.com/zhongwangwei/CoLM-Desktop"
publish = false

# Tauri 的二进制链接的是这个 lib；main.rs 只是一层薄壳。
[lib]
name = "colm_desktop_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 只链接**不含 netcdf** 的那几层。实测各 crate 的 netcdf/hdf5 依赖节点数：
# colm-namelist 0、colm-schema 0、colm-case 0、colm-kernel 0、colm-hist(默认) 0；
# 而 colm-forcing 7、colm-srfdata 7、colm-cli 9。
# 凡要读 NetCDF 的一律走 colm-cli sidecar —— 窗口进程不该为了画一条曲线
# 把整个静态 HDF5 拖进来。
colm-namelist = { path = "../../crates/colm-namelist" }
colm-schema = { path = "../../crates/colm-schema" }
colm-case = { path = "../../crates/colm-case" }
# 校验内核目录（清单 + 三个二进制的 sha256）。它自己 0 个 netcdf 依赖，
# 拖不进 HDF5 —— 上面那份依赖节点数清单里 colm-kernel 正是 0。
colm-kernel = { path = "../../crates/colm-kernel" }
# 闸门表：哪个输出变量在什么条件下才写得出来。**默认 features** ——
# 那一半是 netcdf-free 的， feature 才拖 netcdf，这里不开。
colm-hist = { path = "../../crates/colm-hist" }
# 原生的文件/文件夹选择器。**路径不该让人手打** —— 一个 Sitedata 目录
# 的绝对路径打错一个字符，报错会出现在完全无关的地方。
# 用 rfd 而不是 tauri-plugin-dialog：后者的 JS 侧要走 npm 包，
# 而本项目的前端**无 npm**（design.md §4.2）。rfd 正是那个插件底下用的东西。
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

# **自己就是一个 workspace 根。** 这一行把 429 个 Tauri 依赖挡在引擎
# workspace 之外 —— 引擎那边只有 70 个，`cargo test --workspace` 不该
# 每次面对 429 个 crate。见 design.md §4.1。
[workspace]
