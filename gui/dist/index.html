<!doctype html>
<meta charset="utf-8">
<title>CoLM Desktop</title>
<link rel="stylesheet" href="vendor/uplot/uPlot.min.css">
<link rel="stylesheet" href="app/style.css">
<body>

<aside>
  <h2>算例库</h2>
  <div class="row"><input id="root" placeholder="算例目录"><button id="rescan">扫描</button>
    <button id="runall" disabled>运行全部</button></div>
  <div id="cases" style="margin-top:8px"></div>
  <h2 style="margin-top:18px">站点库</h2>
  <div class="row"><input id="sitedir" placeholder="Sitedata 目录"><button id="scan">扫描</button></div>
  <p id="sitesummary" class="muted" style="font-size:11px">&nbsp;</p>
  <div id="sites" style="max-height:26vh;overflow:auto"></div>

  <h2 style="margin-top:18px">新建</h2>
  <label>站点文件（在上面选，或直接填路径）</label><input id="w-site">
  <label>算例名（留空则用站点代号）</label><input id="w-name">
  <div class="row">
    <div style="flex:1"><label>起（可选）</label><input id="w-start" placeholder="2008-01-01"></div>
    <div style="flex:1"><label>止（可选）</label><input id="w-end" placeholder="2008-01-11"></div>
  </div>
  <p class="muted" style="font-size:11px">经纬度、地类、时间步长与默认窗口都从文件里读，不用填。</p>
  <button id="create" style="margin-top:6px">新建算例</button>
</aside>

<main>
  <h2>配置</h2>
  <p id="status" class="muted">连接后端…</p>
  <div id="unknown"></div>
  <div class="tabs" id="tabs"></div>
  <div id="fields"></div>

  <h2 style="margin-top:18px">运行</h2>
  <div class="row">
    <select id="kernel" style="flex:1"></select>
    <button id="run" disabled>运行</button>
  </div>
  <p id="kernelmeta" class="muted" style="font-size:11px">&nbsp;</p>
  <div class="bar"><i id="prog"></i></div>
  <p id="progtext" class="muted" style="font-size:11px">&nbsp;</p>
  <pre id="log"></pre>
</main>

<div class="results">
  <h2>结果</h2>
  <div class="row">
    <select id="var"></select><button id="plot" disabled>画图</button>
  </div>
  <div id="charts" style="margin-top:10px"></div>

  <h2 style="margin-top:18px">评估</h2>
  <div class="row">
    <input id="obs" placeholder="观测文件（*_Flux.nc）" style="flex:1">
    <label style="margin:0;white-space:nowrap">丢弃前
      <input id="spinup" type="number" value="0" min="0" style="width:5em;display:inline-block">
      条</label>
    <button id="evaluate" disabled>评估</button>
  </div>
  <p class="muted" style="font-size:11px">
    「丢弃前 N 条」丢的是<b>输出记录</b>，与模型预热（spin-up）不是一回事 ——
    后者在时间分类里，且预热期本来就不写 history。
  </p>
  <div id="metrics"></div>
</div>

<script src="vendor/uplot/uPlot.iife.min.js"></script>
<script type="module" src="app/main.js"></script>
</body>
