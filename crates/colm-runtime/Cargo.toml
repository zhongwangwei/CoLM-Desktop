[package]
name = "colm-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
colm-numeric = { path = "../colm-numeric" }
anyhow.workspace = true
colm-core = { path = "../colm-core" }
colm-forcing = { path = "../colm-forcing" }
colm-namelist = { path = "../colm-namelist" }
# 物理参数的缺省值取自 `MOD_Namelist.F90` 的声明默认值（生成的 schema），
# 而不是在映射里各写一份 —— 两处默认值迟早会分叉。
colm-schema = { path = "../colm-schema" }
# 算例目录布局（`case.nml`、`out/<name>`）与算例名。造文件与跑模型是两件事，
# 但这个 crate 本来就在执行阶段，读布局不算越界。
colm-case = { path = "../colm-case" }
# 装配层要从写出的 restart 里取静态量与演化态。它属于**执行阶段**，不属于初始化
# 阶段；把它放进 colm-init 会让那个 crate 变成第二个 colm.x（见其 lib 文档）。
colm-init = { path = "../colm-init" }
# history 写出：闸门表 + `HistoryBuffers::write`。它默认不带 netcdf（GUI 那条链
# 只要闸门表），这里显式开 `io` —— 运行时本来就要链接 netcdf。
colm-hist = { path = "../colm-hist", features = ["io"] }
# 混合模型插槽（docs/design-hybrid.md）：配置、tract 推理后端。
colm-hybrid = { path = "../colm-hybrid" }
# `--hybrid-dry-run` 的汇总以 JSON 输出（给 colm-cli hybrid-check 与 GUI）。
serde.workspace = true
serde_json.workspace = true
# `DEF_Optimize_Baseflow` 逐年写 `ParaOpt/*_baseflow.nc`（`MOD_Opt_Baseflow.F90`）。
# 已经经 colm-hist/colm-init 静态链接进来，这里只是直接用它的 API。
netcdf = { workspace = true, features = ["static"] }
# 河道汇流在全球 25 万个单元流域上逐子步推进：每个阶段逐单元流域独立（河系内取最小子步长的
# `min` 归约与顺序无关），并行不改变任何一位结果。
rayon.workspace = true

[dev-dependencies]
# 合成 restart 算例只在测试构建里需要，所以 feature 也只开在 dev 依赖上。
colm-init = { path = "../colm-init", features = ["fixtures"] }

[lints]
workspace = true
