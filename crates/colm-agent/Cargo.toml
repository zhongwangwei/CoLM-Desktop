[package]
name = "colm-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
colm-namelist = { path = "../colm-namelist" }
colm-case = { path = "../colm-case" }
colm-schema = { path = "../colm-schema" }
# 同步 HTTP 客户端（rustls），流式读 SSE。agent 是独立 sidecar，不需要异步运行时。
ureq = { version = "3", features = ["json"] }

# Atomic no-replace recycling requires native rename APIs; only that helper permits FFI.
[lints.rust]
unsafe_code = "deny"
