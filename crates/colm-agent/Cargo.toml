[package]
name = "colm-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
colm-namelist = { path = "../colm-namelist" }
colm-case = { path = "../colm-case" }
colm-schema = { path = "../colm-schema" }
# 同步 HTTP 客户端（rustls），流式读 SSE。agent 是独立 sidecar，不需要异步运行时。
ureq = { version = "3", features = ["json"] }
# 纯 Rust PDF 文字层提取：本地 fetch 与本地附件用，避免把文档交给第三方（第 765/766 轮）。
pdf-extract = "0.12.1"
# DOCX 是 zip + XML；只开 deflate，避免把 bzip2/zstd/aes 等全部拉进 sidecar。
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Atomic no-replace recycling requires native rename APIs; only that helper permits FFI.
[lints.rust]
unsafe_code = "deny"
