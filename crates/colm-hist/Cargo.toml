[package]
name = "colm-hist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true   # 必须显式 opt-in
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
colm-numeric = { path = "../colm-numeric" }
# 闸门表那一半刻意不带 netcdf —— GUI 为了问一句「这个内核能产出什么」
# 不该拖进整个 HDF5。读文件与算指标那一半才需要 netcdf，所以做成 feature。
# anyhow 是纯 Rust 的错误包装，colm-namelist / colm-case / colm-kernel 也都用它，
# 不改变「默认 features 下 0 个 netcdf 依赖」这条约束；history 的调度是纯逻辑，
# 不该为了一个错误类型被关进 io feature。
netcdf = { workspace = true, features = ["static"], optional = true }
# 网格 history 的并行压缩写入（第 602 轮）：与 netcdf 同一份静态 HDF5，也只在 io 下。
colm-h5chunk = { path = "../colm-h5chunk", optional = true }
rayon = { workspace = true, optional = true }
anyhow.workspace = true

[features]
default = []
io = ["dep:netcdf", "dep:colm-h5chunk", "dep:rayon"]

[lints]
workspace = true
