# design.md §10 里程碑 9 最难的一环：Fortran 内核在 Windows 上原生构建。
#
# §3 把它标成「中等难度：打通一次 MSYS2 netcdf-fortran」，而那句判断从未被验证过。
# 本项目没有 Windows 机器，**CI 就是唯一能做这次验证的地方**。
#
# 与 `ci` 分开是因为关注点不同：那边是 Rust，这边是 Fortran 工具链。
# 探索期只手动触发，现在已跑绿，所以加上 push 与 PR —— Windows 内核一旦
# 再次编不出来，应当在当次改动上就红，而不是等到某次手动触发。
#
# 约 3.5 分钟，其中大半是装 MSYS2 包。
name: windows-kernel

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  kernel:
    runs-on: windows-latest
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: true

      # MINGW64 而不是 UCRT64：netcdf-fortran 在 mingw64 仓库里更成熟，
      # 而本轮只想回答「能不能编出来」，不想同时引入一个新的运行时。
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-netcdf-fortran
            mingw-w64-x86_64-lapack
            mingw-w64-x86_64-msmpi

      - name: What the toolchain actually is
        shell: msys2 {0}
        run: |
          uname -s -m
          gfortran --version | head -1
          nf-config --version || echo "nf-config missing"
          nf-config --flibs   || true
          nc-config --libs    || true
          # SinglePoint 号称不需要 MPI，但 share/MOD_SPMD_Task.F90:34 的
          # `include 'mpif.h'` 在 `#ifndef USEMPI` **之外** —— 所以头文件
          # 必须存在，哪怕一个 MPI 符号都不会被用到。macOS 与 Linux 上
          # 恰好都装着 MPI，所以这件事从没暴露过。
          ls -la /mingw64/include/mpif.h || echo "no mpif.h — that is the blocker"

      - name: Build the waterheat kernel
        shell: msys2 {0}
        run: ./oracle/scripts/build_kernel.sh waterheat

      - name: What came out
        shell: msys2 {0}
        run: |
          ls -la kernels/waterheat/
          cat kernels/waterheat/manifest.json
          # 后缀是 `.x` 而不是 `.exe` —— CoLM 的 Makefile 在所有平台上都这么命名，
          # Windows 也不例外。（第一版这里写的是 .exe，于是构建明明成功却报了失败：
          # 检查错了，不是构建错了。）
          #
          # 「编出来了」与「能跑」是两件事，这里只钉死前者。
          for p in mksrfdata mkinidata colm; do
            test -f "kernels/waterheat/$p.x" || { echo "missing $p.x"; exit 1; }
          done
          # 直接跑一下：不给 namelist 时它应该停下来而不是崩。
          # 只看它能不能被 Windows 加载起来 —— 一个链接到缺失 DLL 的二进制
          # 在这里就会暴露，而那是 MSYS2 构建最典型的失败方式。
          #
          # **但这一句是在 MSYS2 shell 里跑的，`/mingw64/bin` 在 PATH 上。**
          # 它证明的是「在装了 MSYS2 的机器上能跑」，不是「能跑」。下一步才问后者。
          ./kernels/waterheat/colm.x 2>&1 | head -5 || true

      # 内核要跟着桌面程序一起分发，所以真正的问题是：**用户机器上不装 MSYS2，
      # 它还跑不跑？** `nf-config --flibs` 返回的是 `-L/mingw64/lib -lnetcdff
      # -lnetcdf`，动态链接 —— 也就是说 `.x` 依赖一串 MSYS2 的 DLL。
      # design.md §9 写的是「静态链接 gcc 运行时」，那是计划，不是现状。
      #
      # 这一步只**测量**，不判成败：把依赖列出来，再从 PowerShell（没有
      # `/mingw64/bin`）跑一次，看它到底缺什么。有了这份清单才谈得上
      # 「随程序带哪些 DLL」还是「改成静态」。
      - name: Which MSYS2 DLLs does the kernel need
        shell: msys2 {0}
        run: |
          for p in mksrfdata mkinidata colm; do
            echo "=== $p.x ==="
            ldd "kernels/waterheat/$p.x" | grep -i mingw64 || echo "  (none from /mingw64)"
          done
          echo "=== 去重后的清单 ==="
          # 写进文件，下一步（PowerShell）要按它把 DLL 摆到二进制旁边。
          for p in mksrfdata mkinidata colm; do ldd "kernels/waterheat/$p.x"; done \
            | grep -io '/mingw64/bin/[^ ]*\.dll' | sort -u | tee dlls.txt
          echo "共 $(wc -l < dlls.txt) 个"

      # 两问两答，都在 PowerShell 里跑 —— 那里的 PATH 没有 mingw64\bin，
      # 正是用户机器的处境。
      #
      # 拷成 `.exe` 再跑，有两个原因。一是 Windows **不认 `.x` 是可执行扩展名**：
      # PowerShell 会把它当"文档"，`& .\colm.x | ...` 直接报
      # `Cannot run a document in the middle of a pipeline`（第一版就是这么挂的）。
      # 二是这样才测得到 DLL 加载本身，而不是被扩展名挡在门外。
      #
      # 顺带说明为什么这不影响程序本身：`colm-kernel` 用 `Command::new(路径)`
      # 起子进程，走的是 `CreateProcessW`，对显式路径不查 PATHEXT，
      # 只要文件是合法 PE 就能起来。扩展名只在 shell 调用时碍事。
      - name: Does it run without MSYS2 on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path probe | Out-Null
          Copy-Item kernels\waterheat\colm.x probe\colm.exe

          Write-Host "=== 1. 只有二进制，没有 DLL ==="
          & .\probe\colm.exe *> bare.txt
          $bare = $LASTEXITCODE
          Get-Content bare.txt -TotalCount 5
          Write-Host "exit code: $bare"
          if ($bare -eq -1073741515) {
            Write-Host "STATUS_DLL_NOT_FOUND —— 内核必须带着上一步列出的 DLL 一起分发"
          }

          Write-Host "=== 2. 把 DLL 摆到旁边再试 ==="
          # release.yml 就是这么做的：Windows 先在可执行文件同目录找 DLL。
          Get-Content dlls.txt | ForEach-Object {
            $p = $_ -replace '^/mingw64/bin/', 'C:\msys64\mingw64\bin\'
            if (Test-Path $p) { Copy-Item $p probe\ -Force }
          }
          Write-Host "copied $((Get-ChildItem probe\*.dll).Count) DLLs"
          & .\probe\colm.exe *> withdlls.txt
          $with = $LASTEXITCODE
          Get-Content withdlls.txt -TotalCount 5
          Write-Host "exit code: $with"
          # 不给 namelist 时它应该自己停下来 —— 那说明 DLL 都加载上了。
          if ($with -eq -1073741515) {
            Write-Host "::error::带上 DLL 之后仍然是 STATUS_DLL_NOT_FOUND —— 清单不全"
            exit 1
          }
