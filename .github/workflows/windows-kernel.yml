# design.md §10 里程碑 9 最难的一环：Fortran 内核在 Windows 上原生构建。
#
# §3 把它标成「中等难度：打通一次 MSYS2 netcdf-fortran」，而那句判断从未被验证过。
# 本项目没有 Windows 机器，**CI 就是唯一能做这次验证的地方**。
#
# 与 `ci` 分开是因为关注点不同：那边是 Rust，这边是 Fortran 工具链。
# 探索期只手动触发，现在已跑绿，所以加上 push 与 PR —— Windows 内核一旦
# 再次编不出来，应当在当次改动上就红，而不是等到某次手动触发。
#
# 约 3.5 分钟，其中大半是装 MSYS2 包。
name: windows-kernel

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  kernel:
    runs-on: windows-latest
    # **挂住比失败更贵**：一次去掉 `-ffpe-trap` 的尝试让 mksrfdata 跑了
    # 三十多分钟也不结束，而作业的默认上限是六小时。
    timeout-minutes: 30
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: true

      # MINGW64 而不是 UCRT64：netcdf-fortran 在 mingw64 仓库里更成熟，
      # 而本轮只想回答「能不能编出来」，不想同时引入一个新的运行时。
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-gdb
            mingw-w64-x86_64-netcdf-fortran
            mingw-w64-x86_64-lapack
            mingw-w64-x86_64-msmpi

      - name: What the toolchain actually is
        shell: msys2 {0}
        run: |
          uname -s -m
          gfortran --version | head -1
          nf-config --version || echo "nf-config missing"
          nf-config --flibs   || true
          nc-config --libs    || true
          # SinglePoint 号称不需要 MPI，但 share/MOD_SPMD_Task.F90:34 的
          # `include 'mpif.h'` 在 `#ifndef USEMPI` **之外** —— 所以头文件
          # 必须存在，哪怕一个 MPI 符号都不会被用到。macOS 与 Linux 上
          # 恰好都装着 MPI，所以这件事从没暴露过。
          ls -la /mingw64/include/mpif.h || echo "no mpif.h — that is the blocker"

      # cmd 到底认哪种 mkdir —— **量出来，不要推**。
      #
      # CoLM 在 55 处用 `CALL system('mkdir -p ' // 路径)`，而 `system()` 在
      # MinGW 上走 `cmd.exe /c`。实测 stderr 上出现三行
      # `The syntax of the command is incorrect.`，但那句话不说明是 `-p`
      # 的错还是路径形式的错 —— 我们写进 namelist 的目录以 `/` 结尾，
      # 而 cmd 把 `/` 当开关前缀。两个嫌疑都要各自验一遍。
      #
      # 只测量、不判成败：这张表是给人看的，改动依据在它上面。
      - name: What does cmd's mkdir actually accept
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $base = Join-Path $env:RUNNER_TEMP 'mkprobe'
          Remove-Item -Recurse -Force $base -ErrorAction SilentlyContinue
          $cases = @(
            @{ n = 'mkdir -p  嵌套 反斜杠';        c = "mkdir -p $base\a\b" ;  d = "$base\a\b"  },
            @{ n = 'mkdir     嵌套 反斜杠';        c = "mkdir $base\c\d"    ;  d = "$base\c\d"  },
            @{ n = 'mkdir     嵌套 尾反斜杠';      c = "mkdir $base\e\f\"   ;  d = "$base\e\f"  },
            @{ n = 'mkdir     嵌套 尾正斜杠';      c = "mkdir $base\g\h/"   ;  d = "$base\g\h"  },
            @{ n = 'mkdir     全正斜杠';           c = "mkdir $base/i/j"    ;  d = "$base/i/j"  },
            @{ n = 'mkdir     引号 尾反斜杠';      c = "mkdir `"$base\k\l\`"" ; d = "$base\k\l" },
            @{ n = 'mkdir     引号 全正斜杠';       c = "mkdir `"$base/m/n`""  ;  d = "$base/m/n"  },
            @{ n = 'mkdir     引号 混合斜杠';       c = "mkdir `"$base\o\p/q`"" ; d = "$base\o\p/q" },
            @{ n = 'mkdir -p  引号 混合斜杠';       c = "mkdir -p `"$base\r/s`"" ; d = "$base\r/s" },
            @{ n = 'mkdir     已存在的目录';       c = "mkdir $base\c\d"    ;  d = "$base\c\d"  }
          )
          foreach ($x in $cases) {
            & cmd /c $x.c 2>&1 | Out-String | Set-Variable out
            $ok = Test-Path $x.d
            Write-Host ("{0,-28} 退出码 {1,-4} 目录在={2,-6} {3}" -f $x.n, $LASTEXITCODE, $ok, $out.Trim())
          }
          exit 0

      - name: Build the waterheat kernel
        shell: msys2 {0}
        run: ./oracle/scripts/build_kernel.sh waterheat

      - name: What came out
        shell: msys2 {0}
        run: |
          ls -la kernels/waterheat/
          cat kernels/waterheat/manifest.json
          # Makefile 在所有平台都产出 `.x`，`build_kernel.sh` 在 Windows 上把
          # 拷进内核目录的那份改成 `.exe` —— 因为 `PATHEXT` 不含 `.x`，系统不把它
          # 当可执行文件。（本文件早先在这里查 `.exe` 查错过一次：那时还没改名，
          # 于是构建明明成功却报失败。现在两边都改了，查的就是实际产出的名字。）
          #
          # 「编出来了」与「能跑」是两件事，这里只钉死前者。
          for p in mksrfdata mkinidata colm; do
            test -f "kernels/waterheat/$p.exe" || { echo "missing $p.exe"; exit 1; }
          done
          # 直接跑一下：不给 namelist 时它应该停下来而不是崩。
          # 只看它能不能被 Windows 加载起来 —— 一个链接到缺失 DLL 的二进制
          # 在这里就会暴露，而那是 MSYS2 构建最典型的失败方式。
          #
          # **但这一句是在 MSYS2 shell 里跑的，`/mingw64/bin` 在 PATH 上。**
          # 它证明的是「在装了 MSYS2 的机器上能跑」，不是「能跑」。下一步才问后者。
          ./kernels/waterheat/colm.exe 2>&1 | head -5 || true

      # 内核要跟着桌面程序一起分发，所以真正的问题是：**用户机器上不装 MSYS2，
      # 它还跑不跑？** `nf-config --flibs` 返回的是 `-L/mingw64/lib -lnetcdff
      # -lnetcdf`，动态链接 —— 也就是说 `.x` 依赖一串 MSYS2 的 DLL。
      # design.md §9 写的是「静态链接 gcc 运行时」，那是计划，不是现状。
      #
      # 这一步只**测量**，不判成败：把依赖列出来，再从 PowerShell（没有
      # `/mingw64/bin`）跑一次，看它到底缺什么。有了这份清单才谈得上
      # 「随程序带哪些 DLL」还是「改成静态」。
      - name: Which MSYS2 DLLs does the kernel need
        shell: msys2 {0}
        run: |
          for p in mksrfdata mkinidata colm; do
            echo "=== $p.exe ==="
            ldd "kernels/waterheat/$p.exe" | grep -i mingw64 || echo "  (none from /mingw64)"
          done
          echo "=== 去重后的清单 ==="
          # 写进文件，下一步（PowerShell）要按它把 DLL 摆到二进制旁边。
          for p in mksrfdata mkinidata colm; do ldd "kernels/waterheat/$p.exe"; done \
            | grep -io '/mingw64/bin/[^ ]*\.dll' | sort -u | tee dlls.txt
          echo "共 $(wc -l < dlls.txt) 个"
          # **在这里就把它们拷出来**，而不是让下一步（PowerShell）去翻译路径。
          # `/mingw64/bin` 只在 MSYS2 里成立；它的 Windows 真实路径由
          # setup-msys2 决定，不是 `C:\msys64`（第一版这么写，结果 copied 0 DLLs，
          # 而 `Test-Path` 失败是静默的，于是错误伪装成"清单不全"）。
          mkdir -p probe-dlls
          xargs -a dlls.txt -I{} cp {} probe-dlls/
          ls probe-dlls | wc -l
          # 顺便摆进内核目录本身 —— **`release.yml` 装包时就是这么做的**，
          # 所以这一步同时验了那条路。拷 DLL 不改 `.exe` 的字节，
          # `Kernel::open` 的 sha256 校验照样过。
          cp probe-dlls/*.dll kernels/waterheat/

      # 两问两答，都在 PowerShell 里跑 —— 那里的 PATH 没有 mingw64\bin，
      # 正是用户机器的处境。
      #
      # 拷成 `.exe` 再跑，有两个原因。一是 Windows **不认 `.x` 是可执行扩展名**：
      # PowerShell 会把它当"文档"，`& .\colm.x | ...` 直接报
      # `Cannot run a document in the middle of a pipeline`（第一版就是这么挂的）。
      # 二是这样才测得到 DLL 加载本身，而不是被扩展名挡在门外。
      #
      # 顺带说明为什么这不影响程序本身：`colm-kernel` 用 `Command::new(路径)`
      # 起子进程，走的是 `CreateProcessW`，对显式路径不查 PATHEXT，
      # 只要文件是合法 PE 就能起来。扩展名只在 shell 调用时碍事。
      - name: Does it run without MSYS2 on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path probe | Out-Null
          Copy-Item kernels\waterheat\colm.exe probe\colm.exe

          Write-Host "=== 1. 只有二进制，没有 DLL ==="
          & .\probe\colm.exe *> bare.txt
          $bare = $LASTEXITCODE
          Get-Content bare.txt -TotalCount 5
          Write-Host "exit code: $bare"
          if ($bare -eq -1073741515) {
            Write-Host "STATUS_DLL_NOT_FOUND —— 内核必须带着上一步列出的 DLL 一起分发"
          }

          Write-Host "=== 2. 把 DLL 摆到旁边再试 ==="
          # 上一步（MSYS2 里）已经把它们拷进 probe-dlls/，这里只搬一次。
          # release.yml 就是这么做的：Windows 先在可执行文件同目录找 DLL。
          Copy-Item probe-dlls\*.dll probe\ -Force
          $n = (Get-ChildItem probe\*.dll).Count
          Write-Host "copied $n DLLs"
          if ($n -eq 0) { Write-Host "::error::一个 DLL 都没拷到"; exit 1 }
          & .\probe\colm.exe *> withdlls.txt
          $with = $LASTEXITCODE
          Get-Content withdlls.txt -TotalCount 5
          Write-Host "exit code: $with"
          # 不给 namelist 时它应该自己停下来 —— 那说明 DLL 都加载上了。
          if ($with -eq -1073741515) {
            Write-Host "::error::带上 DLL 之后仍然是 STATUS_DLL_NOT_FOUND —— 清单不全"
            exit 1
          }
          # **显式 exit 0。** 上面最后跑的原生命令是 colm.exe，它没拿到 namelist
          # 就停下来、退出码 2 —— 那正是本步骤期待的结果。但 pwsh 步骤结束时会拿
          # `$LASTEXITCODE` 当自己的退出码，于是"测出了预期结果"被记成"步骤失败"。
          #
          # 这是本仓库第三次踩同一个形状：被测程序的非零退出码泄漏成检查本身的
          # 退出码。前两次分别是 macOS 上 `colm-cli | grep -q` 撞上 bash 的
          # pipefail，以及这一步早先那版。**断言写完就把退出码钉死。**
          exit 0

      # 到此为止证明的都是「能不能把它加载起来」。**真正要问的是能不能跑完一个算例**
      # —— 而那一步此前从没在 Windows 上做过，于是第一个装了安装包的人替我们
      # 发现了：`mksrfdata` 一个字符都没打就以 `0xC0E90002` 结束。
      #
      # 用仓库自带的示例站点跑（`examples/`，随安装包分发的就是它），
      # 所以这一步验的正是用户点「运行」会走的那条路。
      - name: A real case, end to end
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo build --release -p colm-cli
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::colm-cli 没编出来"; exit 1 }
          $cli = ".\target\release\colm-cli.exe"
          $site = "examples\Sitedata\CN-Cng_2008-2009_FLUXNET2015_site.nc"

          # **绝对路径**，因为界面传的就是绝对路径（`root + '/' + 站点名'`），
          # 而这一步存在的意义是复现用户点「运行」时走的那条路。
          # 相对路径另有一条，在下面 —— 两种都要过：第一版只试了相对的，
          # 于是抓到的是「`--out` 没绝对化」，而用户报的根本不是那个。
          $abs = Join-Path (Get-Location).Path 'probe-case'

          # 只跑一天：这一步问的是「跑不跑得起来」，不是「结果对不对」，
          # 后者由 macOS 上的黄金回归负责。
          & $cli new --site $site --out $abs --name CN-Cng --end 2008-01-02 --spinup-repeat 0
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::colm-cli new 失败"; exit 1 }

          Write-Host ("run 开始 " + (Get-Date -Format o))
          & $cli run $abs --kernel kernels\waterheat
          $rc = $LASTEXITCODE
          Write-Host ("run 结束 " + (Get-Date -Format o))
          Write-Host "run exit code: $rc"
          foreach ($s in 'mksrfdata','mkinidata','colm') {
            $log = "probe-case\$s.log"
            Write-Host "=== $s.log ==="
            if (Test-Path $log) {
              Write-Host ("  {0} 字节" -f (Get-Item $log).Length)
              # **整份打出来。** 只打前 25 行时，SIGFPE 的回溯恰好在后面 ——
              # 于是日志里只剩一句「收到信号」，指不出是哪一行。
              Get-Content $log
            } else { Write-Host "  (没有这个日志)" }
          }
          if ($rc -ne 0) { Write-Host "::error::算例没跑完"; exit 1 }
          # 产物必须真的在 —— 退出码 0 加空目录是这个项目见过的失败方式。
          $n = (Get-ChildItem probe-case\out\CN-Cng\history\*.nc -ErrorAction SilentlyContinue).Count
          Write-Host "history 文件 $n 个"
          if ($n -lt 1) { Write-Host "::error::没有 history 输出"; exit 1 }

          # 相对路径再来一遍。**两种路径形式是两条不同的代码路径** ——
          # 相对的那条要靠 `--out` 绝对化，而那一处曾经漏掉：写进 case.nml 的
          # `probe-case\forcing.nml` 在算例目录里解析成
          # `probe-case\probe-case\forcing.nml`，报的是「文件不存在」。
          Write-Host "=== 同样的事，改用相对路径 ==="
          & $cli new --site $site --out rel-case --name CN-Cng --end 2008-01-02 --spinup-repeat 0
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::相对路径的 new 失败"; exit 1 }
          & $cli run rel-case --kernel kernels\waterheat
          if ($LASTEXITCODE -ne 0) {
            Get-Content rel-case\mksrfdata.log -TotalCount 20
            Write-Host "::error::相对路径的算例没跑完"; exit 1
          }
          $m = (Get-ChildItem rel-case\out\CN-Cng\history\*.nc -ErrorAction SilentlyContinue).Count
          Write-Host "相对路径 history 文件 $m 个"
          if ($m -lt 1) { Write-Host "::error::相对路径没有 history 输出"; exit 1 }
          exit 0

      # addr2line 无法处理 ASLR 后的运行时地址；在崩溃现场让 GDB 解析。
      - name: Locate SIGFPE under GDB
        if: failure()
        shell: msys2 {0}
        run: |
          cd probe-case
          gdb --batch \
            -ex 'set pagination off' \
            -ex 'handle SIGFPE stop print nopass' \
            -ex run \
            -ex 'thread apply all backtrace' \
            --args ../kernels/waterheat/mksrfdata.exe "$(cygpath -w "$PWD/case.nml")" || true

      # **把病因钉死。** 上一步跑通了不等于知道原来为什么不通 ——
      # 这里故意用 `\?\` 扩展长度路径再跑一次同一个内核。
      #
      # 只测量、不判成败：如果哪天 Windows 支持了这种路径，这一步会安静地
      # 变成「两边都行」，而不是红给一个与用户无关的理由。
      # **把病因钉死。** 上一步跑通了不等于知道原来为什么不通 ——
      # 这里拿同一个内核、同一份 case.nml，只把工作目录换成 `\\?\` 扩展长度
      # 形式（Rust 的 `canonicalize` 在 Windows 上返回的就是这种），
      # 看它是不是就此崩掉。
      #
      # 注意 PowerShell 的 `Resolve-Path` **不带**这个前缀，所以要自己拼 ——
      # 这也说明为什么这个坑只有 Rust 那一侧会踩到。
      #
      # 只测量、不判成败：哪天 Windows 支持了这种路径，这一步会安静地变成
      # 「两边都行」，而不是红给一个与用户无关的理由。
      - name: Why it failed before -- the extended-length prefix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $plain = (Resolve-Path probe-case).Path
          $ext   = "\\?\" + $plain
          $exe   = (Resolve-Path kernels\waterheat\mksrfdata.exe).Path
          Write-Host "普通形式: $plain"
          Write-Host "扩展形式: $ext"
          foreach ($p in @($plain, $ext)) {
            Write-Host "=== 工作目录 = $p ==="
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe
            $psi.Arguments = ('"' + $p + '\case.nml"')
            $psi.WorkingDirectory = $p
            $psi.UseShellExecute = $false
            try {
              $proc = [System.Diagnostics.Process]::Start($psi)
              $proc.WaitForExit()
              $code = $proc.ExitCode
              Write-Host ("  退出码 {0} / 0x{1:X8}" -f $code, ($code -band 0xFFFFFFFF))
            } catch {
              Write-Host "  起不来: $($_.Exception.Message)"
            }
          }
          exit 0

      # 到此为止证明的都是「shell 能不能执行它」。**程序自己走的是另一条路**：
      # `colm-kernel` 用 `Command::new(绝对路径)`，也就是 `CreateProcessW`。
      # 那条路此前从没在 Windows 上跑过，只有一句推断（"对显式路径不查 PATHEXT"）。
      #
      # 用默认 shell 而不是 `msys2 {0}`：Rust 工具链装的是 MSVC 目标，
      # **`cargo` 不在 MSYS2 的 PATH 上**（第一版这么写，报 `cargo: command not found`）。
      # 而 DLL 上一步已经摆进 `kernels/waterheat/` 了，Windows 先在可执行文件
      # 同目录找 DLL，所以这里不需要 MSYS2 的 PATH。
      #
      # 路径给绝对的：`cargo test` 的当前目录是 crate 目录，不是仓库根。
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The Rust side can launch it too
        run: |
          $env:COLM_KERNEL_DIR = "$PWD\kernels\waterheat"
          cargo test -p colm-kernel a_real_kernel_can_actually_be_spawned -- --nocapture
