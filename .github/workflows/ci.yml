name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 每个 PR 都跑：纯 Rust 侧
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # **必须在 checkout 之前**：GitHub 的 Windows runner 默认
      # `core.autocrlf=true`，签出时把文本文件转成 CRLF，而本仓库有三条
      # 逐字节保证（namelist 往返、两张生成表的 drift）全都假定 LF ——
      # 实测三条在 windows-latest 上同时挂，ubuntu 与 macOS 全绿。
      #
      # 本仓库自己的文件由 `.gitattributes` 钉住，但那管不到 submodule：
      # `vendor/CoLM202X` 有自己的工作树与属性，而往返测试读的 55 个 .nml
      # 正在里面。所以这里还要在 git 全局层面关掉转换。
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      # submodule 现在指向 GitHub 上的 CoLM202X fork，托管 runner 取得到。
      # 它是 colm-namelist 的往返测试与 colm-schema 的漂移测试的输入，
      # 那两条因此得以在每个 PR、三个平台上跑，而不再只在自托管作业里。
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 缓存尤其重要：没有它每个作业都要重新从源码编译 HDF5 与 netcdf-c。
      - uses: Swatinem/rust-cache@v2

      # netcdf 是本方案最大的依赖风险点，所以三平台都编一次 —— 为的是让
      # Windows 上的失败在第一天暴露，而不是等到里程碑 9。
      #
      # 三个平台走完全相同的一条命令：netcdf 静态链接是无条件的，
      # 不装任何系统 netcdf，也不设 NETCDF_DIR / HDF5_DIR。
      # 需要 cmake 与 C++ 编译器，三个 GitHub runner 都自带。
      # 首次构建约多花 45 秒编译 HDF5 与 netcdf-c 源码；cargo 会缓存。
      - name: Build
        run: cargo build --workspace --all-targets

      # 除了需要 PLUMBER2 与 rawdata 的那几个之外，全部在这里跑。
      #
      # --lib --bins 拿到纯计算的部分；随后五条集成测试各自点名：
      # judge 与 histmap 只读已入库的黄金文件，roundtrip 与两条 drift 只读
      # submodule 里的 CoLM 源码 —— 五者都不需要第三方数据。
      #
      # histmap 与 colm-hist 的 drift 进这一档的理由与前三条相同：闸门表是
      # 生成的，上游改了 MOD_Hist.F90 而没重新生成，只有 drift 会喊；而
      # histmap 是那张表唯一的经验校验，落进只有自托管 runner 才跑的一档
      # 就等于没有。
      #
      # 剩下的（colm-srfdata 的 raster/real_sites、colm-forcing 的 met/real_forcing）
      # 要 5.5 GB 的 PLUMBER2 与 38 GB 的 rawdata，只能在 golden 作业里跑。
      - name: Test
        # 显式 bash：Windows 上默认是 PowerShell，多行 run 里前面命令的非零
        # 退出**不会**中止后续，只有最后一条决定步骤成败。实测因此吞掉了
        # 两个失败，只报出第三个 —— 照着那条报错去修会修错地方。
        # GitHub 的 bash 带 `set -eo pipefail`。
        shell: bash
        run: |
          cargo test --workspace --lib --bins
          cargo test -p oracle --test judge
          cargo test -p colm-namelist --test roundtrip
          cargo test -p colm-schema --test drift
          cargo test -p oracle --test histmap
          cargo test -p colm-hist --test drift
      # GUI 的前端是纯静态 JS，没有类型检查器 —— 一个拼错的命令名要等到
      # 点下去才会以「command not found」暴露。这条把它提前到 CI。
      - name: GUI interface
        shell: bash
        run: |
          cargo run -q -p xtask -- check-gui
          node gui/tests/domain.mjs
          node gui/tests/batch.mjs
          node gui/tests/params.mjs
          node gui/tests/runview.mjs
          node gui/tests/i18n.mjs
          node gui/tests/sitepaths.mjs
          node gui/tests/prep-workbench.mjs
          node gui/tests/results.mjs

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check

      # 下面两条只读已入库的黄金文件与 tolerances.toml，不需要 PLUMBER2 数据、
      # 也不需要 Fortran 内核，所以能在每个 PR、三个平台上跑。
      #
      # tier-check 若只放在 golden 作业里，就会被 HAS_PLUMBER2 与自托管 runner
      # 双重门控，实际上几乎永不运行 —— 而它要防的正是"有人加了 history 变量却
      # 忘了给它定 tier"，那种改动在任何 PR 里都会发生。
      - name: Tolerance classification is complete
        run: cargo run -p oracle --bin tier-check -- oracle/golden/CN-Cng_hist_2008-01.nc oracle/golden/CN-Cng-wet_hist_2008-07.nc

      # 判官自比对在这里的价值不是"证明两个相同文件相同"，而是证明**静态链接的
      # netcdf 在这个平台上真的能读一个真实 CoLM 文件**，而不只是链接通过。
      # Windows 是本方案的头号风险点，这条让它在第一天就被覆盖。
      - name: Judge can read a real CoLM file on this platform
        # 同上：两条命令，Windows 的 PowerShell 只看最后一条的退出码，
        # 第一条挂了会被吞掉。
        shell: bash
        run: |
          cargo run -p oracle --bin golden-compare -- oracle/golden/CN-Cng_hist_2008-01.nc oracle/golden/CN-Cng_hist_2008-01.nc
          cargo run -p oracle --bin golden-compare -- oracle/golden/CN-Cng-wet_hist_2008-07.nc oracle/golden/CN-Cng-wet_hist_2008-07.nc

  # GUI 的窗口进程与打包路径。**必须单独一个作业**：GUI 是第二个 workspace
  # （431 个 crate，engine 那边只有 72），塞进 rust 作业会把三个平台的
  # 构建时间都拖上去，而它跟 engine 的测试互不依赖。
  #
  # 这条是补上的，不是从一开始就有的 —— 打包路径此前从未在任何地方跑过，
  # 于是两个缺陷一直躺着：`beforeBuildCommand` 的相对路径写错（工作目录是
  # `gui/`，不是 `gui/src-tauri/`），以及 sidecar 找的是 `resource_dir()`
  # 而 Tauri 把它放在主二进制旁边。两个都只在 `cargo tauri build` 之后才现形。
  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      # Tauri 在 Linux 上要系统的 webkit2gtk。macOS 用 WKWebView、
      # Windows 用 WebView2，两者都随系统来，不用装。
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build, lint and test the window process
        shell: bash
        working-directory: gui/src-tauri
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo fmt --all --check

      # 打包只在 macOS 上做。三个平台各打一次要三份 runner 时间，而这一步
      # 要防的两个缺陷都在**与平台无关**的那一段：beforeBuildCommand 的
      # 相对路径，以及 sidecar 落在主二进制旁边这件事（三个平台一致）。
      - name: Bundle, and check the app finds its own sidecar
        if: runner.os == 'macOS'
        shell: bash
        working-directory: gui/src-tauri
        run: |
          # `bundle.resources` 指向 `kernels/`，而这个作业不编 Fortran ——
          # 那是 release.yml 的事，这里只验打包路径本身。**目录不存在会让
          # 打包直接失败**（实测：`resource path '../../kernels' doesn't exist`），
          # 空目录则正常通过。所以给它一个空的。
          mkdir -p ../../kernels
          cargo install tauri-cli --version '^2' --locked
          cargo tauri build --config tauri.bundle.conf.json
          app='target/release/bundle/macos/CoLM Desktop.app'
          test -x "$app/Contents/MacOS/colm-desktop-gui"
          # 这一行是重点。sidecar 曾经被找去 Contents/Resources/，那里只有图标，
          # 而开发机上仓库的 target/ 产物永远兜得住，所以本地跑不出问题。
          test -x "$app/Contents/MacOS/colm-cli"
          # 先收进变量再匹配。`colm-cli` 不带参数时**按设计退出 2**（打印用法），
          # 而 GitHub 的 bash 带 `set -o pipefail` —— 直接 `| grep -q` 会把这个 2
          # 传出来，于是打包明明成功、步骤却报失败。实测踩过。
          usage=$("$app/Contents/MacOS/colm-cli" 2>&1 || true)
          echo "$usage" | grep -q 'colm-cli new'

  # 黄金回归：需要 PLUMBER2 数据与 Fortran 工具链，只在带该数据的 runner 上跑。
  #
  # **同仓库的 PR 才跑。** 本仓库是公开的，而这个作业落在**自托管** runner 上 ——
  # 那是一台真机器，装着 5.5 GB PLUMBER2 与 38 GB rawdata。没有这条守卫的话，
  # 任何人 fork 之后开一个 PR 就能在那台机器上执行任意代码：这是自托管 runner
  # 在公开仓库里的经典失陷方式，而 `vars.HAS_PLUMBER2` 是仓库级变量，
  # 对 fork 来的 PR 同样为真，拦不住。
  #
  # 写这条时 runner 注册数还是 0，也就是说风险是潜伏的、不是现成的。
  # 正因如此才要现在写：接上 runner 的那天没有人会回头补它。
  golden:
    if: >-
      ${{ vars.HAS_PLUMBER2 == 'true'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, plumber2]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Build kernel
        run: ./oracle/scripts/build_kernel.sh default

      - name: Golden regression (both windows)
        env:
          PLUMBER2_ROOT: ${{ vars.PLUMBER2_ROOT }}
        run: |
          set -euo pipefail
          for case in CN-Cng CN-Cng-wet; do
            cargo run -p oracle --bin golden-run -- "$case"
          done
          cargo run -p oracle --bin golden-compare -- \
            oracle/golden/CN-Cng_hist_2008-01.nc \
            oracle/work/CN-Cng/out/CN-Cng/history/CN-Cng_hist_2008-01.nc
          cargo run -p oracle --bin golden-compare -- \
            oracle/golden/CN-Cng-wet_hist_2008-07.nc \
            oracle/work/CN-Cng-wet/out/CN-Cng-wet/history/CN-Cng-wet_hist_2008-07.nc
          cargo run -p oracle --bin tier-check -- oracle/golden/*.nc

      - name: Tests that need the CoLM source
        run: cargo test --workspace

      # 站点文件也进回归：它是黄金输出的输入，改了它而不改黄金文件，
      # 回归就在比两个不同前提下的结果。判官在这里预期退出 0。
      - name: Site file regenerates identically
        env:
          PLUMBER2_ROOT: ${{ vars.PLUMBER2_ROOT }}
          COLM_RAWDATA: ${{ vars.COLM_RAWDATA }}
        run: |
          cargo run -p colm-srfdata --bin site-fill -- \
            "$PLUMBER2_ROOT/Sitedata/CN-Cng_2008-2009_FLUXNET2015_site.nc" \
            /tmp/site-check.nc "$COLM_RAWDATA"
          cargo run -p oracle --bin golden-compare -- oracle/cases/CN-Cng/site.nc /tmp/site-check.nc

  # 让「黄金回归没跑」这件事在 PR 界面上可见，而不是静默缺席。
  golden-status:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Report golden-regression coverage
        run: |
          if [ "${{ vars.HAS_PLUMBER2 }}" = "true" ]; then
            echo "Golden regression ran on the self-hosted runner."
          else
            echo "::warning::Golden regression was NOT run: no PLUMBER2 data on this runner."
            echo "::warning::Green CI here does not mean the numerics are unchanged."
          fi
