# 三平台安装包（macOS 同时发布 Apple Silicon 与 Intel）。**回答的是
# 「用户要不要自己编内核」这个问题**：不要 ——
# Fortran 内核在这里编好，作为 `bundle.resources` 装进安装包，
# 用户机器上不需要 gfortran、netcdf-fortran 或 MSYS2。
#
# 每个平台/架构一个作业，各自：装 Fortran 工具链 → 编 IGBP/USGS → 打包 GUI。
# 内核**不能跨平台或架构复用**，所以四份都要各编各的。
#
# main 上出现尚未发布的新版本时自动触发；tag 仍可补发历史版本。
# 手动触发只构建 artifact，不创建 Release，便于验证流水线本身。
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - gui/**
      - oracle/scripts/**
      - scripts/**
      - vendor/CoLM202X/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes a release build still running for the same branch or tag: several
# runs for one version only compete for runners and race to upload the same assets
# (2026-10-18: four 0.3.0-beta.4 runs at once). An interrupted publish is redone by the next
# run, which sees an incomplete release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.release.outputs.build }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Resolve the version and release state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          gui_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' gui/src-tauri/Cargo.toml | head -1)
          tauri_version=$(sed -n 's/^[[:space:]]*"version": "\([^"]*\)".*/\1/p' gui/src-tauri/tauri.conf.json | head -1)
          if [[ -z "$version" || "$version" != "$gui_version" || "$version" != "$tauri_version" ]]; then
            echo "::error::Release versions disagree: workspace=$version gui=$gui_version tauri=$tauri_version"
            exit 1
          fi

          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the source version $tag"
            exit 1
          fi

          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          build=true
          publish=false
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            complete=false
            if metadata=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv' 2>/dev/null); then
              IFS=$'\t' read -r draft actual_prerelease <<< "$metadata"
              mapfile -t assets < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
              complete=true
              [[ "$draft" == false && "$actual_prerelease" == "$prerelease" ]] || complete=false
              for suffix in _aarch64.dmg _x64.dmg .AppImage .deb .rpm .msi .exe; do
                found=false
                for asset in "${assets[@]}"; do
                  [[ "$asset" == *"$suffix" ]] && found=true && break
                done
                [[ "$found" == true ]] || complete=false
              done
            fi
            if [[ "$complete" == true ]]; then
              build=false
            else
              publish=true
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # 预编的 Rust 引擎（glibc 2.17，x86_64 与 aarch64）：没有 cargo 或不能联网的服务器与超算直接用，
  # 不必在那里编译。与平台无关，所以只在一个 Linux 作业里编一次，各平台的安装包都附带。
  engine-linux:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the prebuilt engines
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-engine-linux.sh "$PWD" "$RUNNER_TEMP/engine-out" "$RUNNER_TEMP/engine-tools" x86_64 aarch64
          ls -la "$RUNNER_TEMP/engine-out"/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: colm-engine-linux
          path: ${{ runner.temp }}/engine-out/colm-engine-linux-*.tar.gz
          if-no-files-found: error

  bundle:
    needs: [prepare, engine-linux]
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-aarch64
            arch: arm64
          - os: macos-15-intel
            label: macos-x86_64
            arch: x86_64
          - os: ubuntu-latest
            label: linux-x86_64
            arch: x86_64
          - os: windows-latest
            label: windows-x86_64
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install and verify React frontend
        # Windows defaults to pwsh, where a failing native command does not stop the
        # script; only the last command would decide the step (see ci.yml).
        shell: bash
        working-directory: gui
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      # Both workspaces: the bundle builds the engine sidecars (colm-cli with static NetCDF/HDF5)
      # in the root workspace, about a quarter of an hour uncached.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gui/src-tauri
            . -> target

      - name: Verify runner architecture
        if: runner.os != 'Windows'
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      # ---- Fortran 工具链，三个平台三种装法 ----
      # 空间内核是普通 MPI/SPMD，并把所用 MPI 运行时一起装进安装包；
      # SinglePoint 本身仍是非 MPI 产物。
      - name: Fortran toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc netcdf-fortran lapack open-mpi

      - name: Fortran toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libnetcdff-dev liblapack-dev \
            libopenmpi-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Windows 的 Fortran 只能走 MSYS2。GUI 那半仍用 MSVC 目标 ——
      # 两条工具链在同一个作业里并存，各编各的，见 design.md §9。
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          # libgomp：内核用 -fopenmp 链它，MSYS2 的 GCC 16.2.0-4 把它拆成单独的包，不再随 gcc 装上
          # （2026-10-05 发布在 `cannot find -lgomp` 上失败）。折叠块里不能写注释，所以写在这里。
          install: >-
            git make python
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-libgomp
            mingw-w64-x86_64-netcdf-fortran
            mingw-w64-x86_64-lapack
            mingw-w64-x86_64-msmpi

      - name: Microsoft MPI launcher (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # MS-MPI 10.1.3: https://www.microsoft.com/download/details.aspx?id=105289
          $installer = Join-Path $env:RUNNER_TEMP 'msmpisetup.exe'
          Invoke-WebRequest -UseBasicParsing 'https://download.microsoft.com/download/7/2/7/72731ebb-b63c-4170-ade7-836966263a8f/msmpisetup.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '47443829114d8d8670f77af98939fe876d33eceb35d0ce4e0e85efeec4d87213') {
            throw 'MS-MPI installer checksum mismatch'
          }
          $process = Start-Process $installer -ArgumentList '-unattend', '-force' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MS-MPI installer exited $($process.ExitCode)" }
          foreach ($file in @("$env:ProgramFiles\Microsoft MPI\Bin\mpiexec.exe", "$env:ProgramFiles\Microsoft MPI\Bin\smpd.exe", "$env:WINDIR\System32\msmpi.dll")) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "MS-MPI runtime missing: $file" }
          }

      # ---- 发布编译期内核 ----
      # PFT/PC/BGC/URBAN 已是运行时选择；IGBP/USGS 与 CROP 数组尺寸仍需产物。
      # Fifteen kernels take 33 min (Linux) to 2 h (Intel macOS) and change only with the Fortran
      # source or the toolchain, so they are cached under both. The key's toolchain part is a file
      # because the Windows compilers live in MSYS2. ensure_native_kernels.py still checks every
      # restored kernel against the exact source fingerprint and, with COLM_BUILD_KERNELS=1 on the
      # bundle step, rebuilds any that do not match. The script itself is not in the fingerprint.
      - name: Record the kernel toolchain (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          { uname -sm; gfortran --version | sed -n 1p; mpifort --version 2>/dev/null | sed -n 1p || true
            nf-config --version 2>/dev/null || true; } > .kernel-toolchain
          cat .kernel-toolchain

      - name: Record the kernel toolchain (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          { uname -sm; gfortran --version | sed -n 1p; nf-config --version 2>/dev/null || true
            pacman -Q mingw-w64-x86_64-msmpi 2>/dev/null || true; } > .kernel-toolchain
          cat .kernel-toolchain

      - name: Restore release kernels
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: kernels
          key: kernels-v1-${{ matrix.label }}-${{ hashFiles('.kernel-toolchain') }}-${{ hashFiles('vendor/CoLM202X/**/*.F90', 'vendor/CoLM202X/**/*.f90', 'vendor/CoLM202X/**/*.F', 'vendor/CoLM202X/**/*.f', 'vendor/CoLM202X/**/*.c', 'vendor/CoLM202X/**/*.h', 'vendor/CoLM202X/**/*.inc', 'vendor/CoLM202X/**/*.sh', 'vendor/CoLM202X/**/*.mk', 'vendor/CoLM202X/**/Makefile*', 'vendor/CoLM202X/**/Makeoptions*', 'oracle/scripts/build_kernel.sh', 'oracle/scripts/kernel-presets.config', 'oracle/scripts/makeoptions/**') }}

      - name: Build release kernels (unix)
        if: runner.os != 'Windows' && steps.kernel-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          for p in $(cat oracle/scripts/kernel-presets.config); do ./oracle/scripts/build_kernel.sh "$p"; done
          ls -la kernels/*/

      - name: Build release kernels (Windows)
        if: runner.os == 'Windows' && steps.kernel-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          for p in $(cat oracle/scripts/kernel-presets.config); do ./oracle/scripts/build_kernel.sh "$p"; done
          ls -la kernels/*/
          # 动态链接 netcdff/netcdf，所以二进制要跟 MSYS2 的 DLL 一起走。
          # 实测：不带 DLL 时退出码 -1073741515（STATUS_DLL_NOT_FOUND），
          # 把 48 个 DLL 摆到旁边就能起来。Windows 先在可执行文件同目录找 DLL，
          # 所以抄过去就够，装出来的程序不需要 MSYS2。
          # （windows-kernel.yml 里有两步专门测量并断言这件事。）
          #
          # 这里是 `*.exe` 不是 `*.x`：`build_kernel.sh` 在 Windows 上把
          # 拷进内核目录的那份改了名，因为 `PATHEXT` 不含 `.x`。
          for d in kernels/*/; do
            for x in "$d"*.exe; do
              ldd "$x" | grep -io '/mingw64/bin/[^ ]*\.dll'
            done | sort -u | while read -r dll; do cp -n "$dll" "$d"; done
            echo "$d: $(ls "$d"*.dll | wc -l) DLLs"
          done

      # Saved straight after building: the MPI staging below rewrites macOS kernels in place.
      - name: Save release kernels
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kernels
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}

      - name: Release kernels use the production profile
        shell: bash
        run: |
          for manifest in kernels/*/manifest.json; do
            grep -q '"build_profile": "production"' "$manifest" || {
              echo "::error file=$manifest::release kernel is not production"
              exit 1
            }
          done

      - name: Bundle the MPI runtime used by spatial kernels (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./oracle/scripts/stage_mpi_runtime.sh kernels

      - name: Bundle the MPI runtime used by spatial kernels (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./oracle/scripts/stage_mpi_runtime.sh kernels

      - name: Smoke staged MPI runtime
        shell: bash
        timeout-minutes: 3
        env:
          COLM_KERNEL_DIR: ${{ github.workspace }}/kernels/latlon
          COLM_KERNEL_RANKS: 2
        run: cargo test -p colm-kernel a_real_kernel_can_actually_be_spawned -- --nocapture

      - name: Prebuilt engines for remote runs
        uses: actions/download-artifact@v4
        with:
          name: colm-engine-linux
          path: gui/src-tauri/engine

      - name: Bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: gui/src-tauri
        env:
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          # A local bundle reuses stale kernels; a release rebuilds any the cache did not match.
          COLM_BUILD_KERNELS: '1'
        run: bash ../../scripts/bundle-release.sh

      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: gui/src-tauri
        env:
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          # A local bundle reuses stale kernels; a release rebuilds any the cache did not match.
          COLM_BUILD_KERNELS: '1'
        run: bash ../../scripts/bundle-release.sh

      # 装出来的东西必须自带内核，否则这条流水线就白跑了。
      # macOS 上能直接查；另外两个平台的目录结构不同，只查产物存在。
      - name: The installer carries its own kernels
        if: runner.os == 'macOS'
        shell: bash
        working-directory: gui/src-tauri
        run: |
          app='target/release/bundle/macos/CoLM Desktop.app'
          for p in $(cat ../../oracle/scripts/kernel-presets.config); do
            test -x "$app/Contents/Resources/kernels/$p/colm.x"
            test -f "$app/Contents/Resources/kernels/$p/manifest.json"
          done
          test -x "$app/Contents/Resources/kernels/_runtime/bin/mpiexec"
          test -x "$app/Contents/MacOS/colm-cli"
          # 远程运行要用的：随附的引擎源码（没有仓库也能在服务器上编），以及两种架构的预编引擎。
          test -f "$app/Contents/Resources/engine/colm-src.tar.gz"
          test -f "$app/Contents/Resources/docs/colm-process-knowledge.md"
          test -f "$app/Contents/Resources/docs/knowledge-sources.json"
          # Public docs must be the exact bytes shipped inside the source snapshot.
          for doc in colm-process-knowledge.md knowledge-sources.json; do
            tar -xOzf "$app/Contents/Resources/engine/colm-src.tar.gz" "docs/$doc" | cmp - "$app/Contents/Resources/docs/$doc"
          done
          test -f "$app/Contents/Resources/engine/colm-engine-linux-x86_64.tar.gz"
          test -f "$app/Contents/Resources/engine/colm-engine-linux-aarch64.tar.gz"
          # 示例站点也必须在里面：少了它，一个刚装好程序的人手上没有任何
          # 数据，连「这程序能不能用」都判断不了。三件套缺一不可 ——
          # 少了 Forcing 界面会说「这个站点没有强迫场，跑不了」，
          # 少了 Observation 则是评估按钮一直灰着，两者都不像是打包漏了。
          s=CN-Cng_2008-2009_FLUXNET2015
          test -f "$app/Contents/Resources/examples/Sitedata/${s}_site.nc"
          test -f "$app/Contents/Resources/examples/Forcing/${s}_Met.nc"
          test -f "$app/Contents/Resources/examples/Observation/${s}_Flux.nc"
          c=US-Ne3_2002-2003_FLUXNET2015_CROP
          test -f "$app/Contents/Resources/examples/Sitedata/${c}_site.nc"
          test -f "$app/Contents/Resources/examples/Forcing/${c}_Met.nc"
          test -f "$app/Contents/Resources/examples/Observation/${c}_Flux.nc"
          test -f "$app/Contents/Resources/examples/Runtime/ndep/fndep_colm_hist_simyr1849-2006_1.9x2.5_c100428.nc"
          s=AT-Neu_2010-2012_FLUXNET-CH4
          test -f "$app/Contents/Resources/examples/Sitedata/${s}_site.nc"
          test -f "$app/Contents/Resources/examples/Forcing/${s}_Met.nc"
          test -f "$app/Contents/Resources/examples/Observation/${s}_Flux.nc"
          test -f "$app/Contents/Resources/examples/Forcingnml/AT-Neu.nml"

      - uses: actions/upload-artifact@v4
        with:
          name: colm-desktop-${{ matrix.label }}
          path: |
            gui/src-tauri/target/release/bundle/dmg/*.dmg
            gui/src-tauri/target/release/bundle/deb/*.deb
            gui/src-tauri/target/release/bundle/rpm/*.rpm
            gui/src-tauri/target/release/bundle/appimage/*.AppImage
            gui/src-tauri/target/release/bundle/msi/*.msi
            gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # main 新版本或 tag 自动发布；手动触发时上一段的 artifact 已经够看了。
  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: CoLM Desktop ${{ needs.prepare.outputs.tag }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: dist/**/*
          fail_on_unmatched_files: true
          draft: false
          generate_release_notes: true
