# 三平台安装包。**回答的是「用户要不要自己编内核」这个问题**：不要 ——
# Fortran 内核在这里编好，作为 `bundle.resources` 装进安装包，
# 用户机器上不需要 gfortran、netcdf-fortran 或 MSYS2。
#
# 每个平台一个作业，各自：装 Fortran 工具链 → 编三个预设 → 打包 GUI。
# 内核**不能跨平台复用**，所以三份都要各编各的。
#
# 打 tag 触发；也留了手动触发，用来在没有 tag 的情况下试这条流水线本身。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-aarch64
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      # ---- Fortran 工具链，三个平台三种装法 ----
      # open-mpi 是**必须的，哪怕这三个预设都不用 MPI**：
      # `MOD_SPMD_Task.F90:34` 的 `include 'mpif.h'` 在任何 `#ifdef` 之外，
      # 而 `#ifndef USEMPI` 从下一行才开始 —— 所以 SinglePoint 把 USEMPI
      # 关掉了，头文件照样要找得到。Windows 那步早就装了 msmpi，
      # 两个 unix 步骤漏了，于是三平台构建在第二个 .o 上就停了。
      - name: Fortran toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc netcdf-fortran lapack open-mpi

      - name: Fortran toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libnetcdff-dev liblapack-dev \
            libopenmpi-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Windows 的 Fortran 只能走 MSYS2。GUI 那半仍用 MSVC 目标 ——
      # 两条工具链在同一个作业里并存，各编各的，见 design.md §9。
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-netcdf-fortran
            mingw-w64-x86_64-lapack
            mingw-w64-x86_64-msmpi

      # ---- 三个物理预设 ----
      # 一个都不能少：GUI 的下拉框列的就是 kernels/ 下面能通过
      # `Kernel::open` 校验的那些，少编一个用户就少一套物理。
      - name: Build the three presets (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for p in default bgc urban; do ./oracle/scripts/build_kernel.sh "$p"; done
          ls -la kernels/*/

      - name: Build the three presets (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          for p in default bgc urban; do ./oracle/scripts/build_kernel.sh "$p"; done
          ls -la kernels/*/
          # 动态链接 netcdff/netcdf，所以二进制要跟 MSYS2 的 DLL 一起走。
          # 实测：不带 DLL 时退出码 -1073741515（STATUS_DLL_NOT_FOUND），
          # 把 48 个 DLL 摆到旁边就能起来。Windows 先在可执行文件同目录找 DLL，
          # 所以抄过去就够，装出来的程序不需要 MSYS2。
          # （windows-kernel.yml 里有两步专门测量并断言这件事。）
          #
          # 这里是 `*.exe` 不是 `*.x`：`build_kernel.sh` 在 Windows 上把
          # 拷进内核目录的那份改了名，因为 `PATHEXT` 不含 `.x`。
          for d in kernels/*/; do
            for x in "$d"*.exe; do
              ldd "$x" | grep -io '/mingw64/bin/[^ ]*\.dll'
            done | sort -u | while read -r dll; do cp -n "$dll" "$d"; done
            echo "$d: $(ls "$d"*.dll | wc -l) DLLs"
          done

      - name: Bundle
        shell: bash
        working-directory: gui/src-tauri
        run: |
          cargo install tauri-cli --version '^2' --locked
          cargo tauri build --config tauri.bundle.conf.json

      # 装出来的东西必须自带内核，否则这条流水线就白跑了。
      # macOS 上能直接查；另外两个平台的目录结构不同，只查产物存在。
      - name: The installer carries its own kernels
        if: runner.os == 'macOS'
        shell: bash
        working-directory: gui/src-tauri
        run: |
          app='target/release/bundle/macos/CoLM Desktop.app'
          for p in default bgc urban; do
            test -x "$app/Contents/Resources/kernels/$p/colm.x"
            test -f "$app/Contents/Resources/kernels/$p/manifest.json"
          done
          test -x "$app/Contents/MacOS/colm-cli"
          # 示例站点也必须在里面：少了它，一个刚装好程序的人手上没有任何
          # 数据，连「这程序能不能用」都判断不了。三件套缺一不可 ——
          # 少了 Forcing 界面会说「这个站点没有强迫场，跑不了」，
          # 少了 Observation 则是评估按钮一直灰着，两者都不像是打包漏了。
          s=CN-Cng_2008-2009_FLUXNET2015
          test -f "$app/Contents/Resources/examples/Sitedata/${s}_site.nc"
          test -f "$app/Contents/Resources/examples/Forcing/${s}_Met.nc"
          test -f "$app/Contents/Resources/examples/Observation/${s}_Flux.nc"

      - uses: actions/upload-artifact@v4
        with:
          name: colm-desktop-${{ matrix.label }}
          path: |
            gui/src-tauri/target/release/bundle/dmg/*.dmg
            gui/src-tauri/target/release/bundle/deb/*.deb
            gui/src-tauri/target/release/bundle/rpm/*.rpm
            gui/src-tauri/target/release/bundle/appimage/*.AppImage
            gui/src-tauri/target/release/bundle/msi/*.msi
            gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # 只有打 tag 时才发布。手动触发时上一段的 artifact 已经够看了。
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: true          # 人过一眼再发
          generate_release_notes: true
